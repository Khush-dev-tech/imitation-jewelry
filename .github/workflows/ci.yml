name: CI

# TRD §11: lint, type-check, unit tests, and build run on every pull request.
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholder — prisma generate does not need a live database
      # connection, only a syntactically valid URL to satisfy env("DATABASE_URL").
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run format:check

      - run: npm run build
